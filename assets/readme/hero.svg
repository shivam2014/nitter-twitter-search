<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">nitter-search: public X/Twitter search that survives dead mirrors</title>
  <desc id="heroDesc">Terminal-style board. Left: project name, one-line promise, and three ways to call it. Right: a real instances_tried run where one mirror answers over RSS in 1.8 seconds, one is blocked by a challenge, and one answers through a browser in 8.4 seconds.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141922" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#0A0C10"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)" opacity="0.65"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="23.5" fill="none" stroke="#1B2230"/>

  <g id="title-block">
    <text x="64" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2.6" fill="#FF6B5E">MCP SERVER · CLI · PYTHON</text>

    <text x="64" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="58" font-weight="700" fill="#EEF2F7">nitter-search</text>

    <text x="64" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#C4CCD8">Public X/Twitter posts, no API key.</text>
    <text x="64" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#8B95A5">Mirrors fail. The search doesn’t.</text>

    <g id="chips">
      <rect x="64" y="272" width="118" height="40" rx="10" fill="#12161D" stroke="#2A3546"/>
      <text x="123" y="298" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#D3DAE4">MCP tools</text>
      <rect x="194" y="272" width="78" height="40" rx="10" fill="#12161D" stroke="#2A3546"/>
      <text x="233" y="298" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#D3DAE4">CLI</text>
      <rect x="284" y="272" width="102" height="40" rx="10" fill="#12161D" stroke="#2A3546"/>
      <text x="335" y="298" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#D3DAE4">Python</text>
    </g>

    <text x="64" y="392" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#6B7686">nitter-twitter-search · v2.0.0 · MIT · 155 offline tests</text>
  </g>

  <g id="proof-card">
    <rect x="688" y="44" width="452" height="312" rx="18" fill="#0D1015" stroke="#222B38"/>
    <circle cx="716" cy="76" r="5" fill="#FF6B5E"/>
    <text x="732" y="82" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8B95A5">instances_tried</text>
    <text x="1112" y="82" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#6B7686">3 tried</text>

    <line x1="688" y1="104" x2="1140" y2="104" stroke="#1C2431"/>

    <g id="row-ratelimited">
      <circle cx="722" cy="136" r="9" fill="#331516" stroke="#7A2E2E"/>
      <path d="M718.5 132.5l7 7M725.5 132.5l-7 7" fill="none" stroke="#FF6B5E" stroke-width="2" stroke-linecap="round"/>
      <text x="746" y="142" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#B9C2CF">nitter.netbub.com</text>
      <text x="1112" y="142" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#FF6B5E">rate limited</text>
    </g>

    <g id="row-challenge">
      <circle cx="722" cy="188" r="9" fill="#33280E" stroke="#7A5B1A"/>
      <path d="M718.5 184.5l7 7M725.5 184.5l-7 7" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
      <text x="746" y="194" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#B9C2CF">nitter.tiekoetter.com</text>
      <text x="1112" y="194" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#FBBF24">challenge</text>
    </g>

    <g id="row-browser">
      <circle cx="722" cy="240" r="9" fill="#123322" stroke="#2F7D55"/>
      <path d="M717.5 240l3.5 3.5 6-7" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="746" y="246" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#E6EBF2">nitter.jaydenha.uk</text>
      <text x="1112" y="246" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#4ADE80">browser · 8.4s</text>
    </g>

    <line x1="712" y1="272" x2="1116" y2="272" stroke="#1C2431"/>

    <text x="712" y="302" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#6B7686">method</text>
    <text x="782" y="302" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#C4CCD8">browser · 40 tweets · newest first</text>

    <text x="712" y="332" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#6B7686">fallback</text>
    <text x="806" y="332" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#C4CCD8">automatic, health-aware</text>
  </g>
</svg>
