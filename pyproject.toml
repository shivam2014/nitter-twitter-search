[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nitter-twitter-search"
version = "2.0.0"
description = "Search Twitter/X through Nitter mirrors, with automatic instance discovery and browser fallback"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "shivam2014" }
]
keywords = ["twitter", "nitter", "ai-agents", "web-scraping", "camoufox", "search", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
camoufox = ["camoufox>=0.5.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
nitter-search = "nitter_search.cli:main"
nitter-search-mcp = "nitter_search.mcp_server:main"

[project.urls]
Homepage = "https://github.com/shivam2014/nitter-twitter-search"
Documentation = "https://github.com/shivam2014/nitter-twitter-search#readme"
Repository = "https://github.com/shivam2014/nitter-twitter-search.git"
Issues = "https://github.com/shivam2014/nitter-twitter-search/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-q",
    "--tb=short",
    "--strict-markers",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
